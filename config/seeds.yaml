# Analyst-maintained seed list of candidate private targets to crawl.
#
# The website-crawl source reads this list, resolves/verifies each company's
# domain, then crawls About/History/Team pages for founding year, family
# ownership language, and owner names. State Secretary of State ingestion would
# normally auto-populate this role, but IL/IN public registries are CAPTCHA/WAF
# gated and not keyless-automatable (see README Data Gaps), so for those states
# an analyst curates this list by hand.
#
# Fields: name (required), state (optional), domain (optional - guessed if blank).

